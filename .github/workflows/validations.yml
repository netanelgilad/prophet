name: Validations

on: [push, pull_request]

permissions:
  contents: read

env:
  CI: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use pinned Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned dependencies
        run: node .yarn/releases/yarn-3.1.1.cjs install --immutable
      - name: Run tests
        run: node .yarn/releases/yarn-3.1.1.cjs test --runInBand

  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use pinned Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned dependencies
        run: node .yarn/releases/yarn-3.1.1.cjs install --immutable
      - name: Run typecheck
        run: node .yarn/releases/yarn-3.1.1.cjs typecheck
